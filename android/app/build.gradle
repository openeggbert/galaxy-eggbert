plugins {
    id 'com.android.application'
}

// The workstation's shared compiler cache and its six-job ceiling (../../CLAUDE.md rules 1 and 5):
// ccache only where it is installed; ninja's compile jobs pooled to six.
def ccacheOnPath = System.getenv("PATH").split(File.pathSeparator).any { new File(it, "ccache").canExecute() }
def nativeBuildExtraArguments = ["-DCMAKE_JOB_POOLS=compile=6", "-DCMAKE_JOB_POOL_COMPILE=compile"] +
        (ccacheOnPath ? ["-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"] : [])

// CNA and cna-engine: local.properties' cna.home / cna.engine.home, else the environment's CNA_HOME /
// CNA_ENGINE_HOME, else the siblings ../cna and ../cna-engine of this repository (the root
// CMakeLists.txt's own defaults). The SDL3 Java glue is CNA's own copy of SDL, so that it always
// matches the libSDL3.so CNA builds.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def repoRoot = rootProject.file("..").canonicalFile
def siblingPath = { String property, String variable, String sibling ->
    def value = localProperties.getProperty(property) ?: System.getenv(variable)
    return value ? new File(value).canonicalFile : new File(repoRoot, "../" + sibling).canonicalFile
}
def cnaHome = siblingPath("cna.home", "CNA_HOME", "cna")
def cnaEngineHome = siblingPath("cna.engine.home", "CNA_ENGINE_HOME", "cna-engine")
nativeBuildExtraArguments += ["-DCNA_HOME=${cnaHome}", "-DCNA_ENGINE_HOME=${cnaEngineHome}"]

// The game reads its files with relative paths (std::ifstream, std::filesystem), which do not see
// the APK's assets: on start it copies them into internal storage and works there
// (src/GalaxyEggbertCNA/AndroidAssets.cpp). assets.txt lists every packaged file, its first line a
// stamp over their names, sizes and times; a changed stamp copies them again.
abstract class GalaxyAssetManifest extends DefaultTask {
    // Content/icons2x and Content/backgrounds2x: the desktop's 2x sheets (TextureScale.hpp), not packaged.
    static final List<String> SKIPPED_DIRS = ['icons2x', 'backgrounds2x']

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getAssetTree()

    @Internal
    abstract DirectoryProperty getAssetRoot()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void write() {
        def root = assetRoot.get().asFile
        def names = []
        root.eachFileRecurse(groovy.io.FileType.FILES) { file ->
            def name = root.toPath().relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char)
            // aapt's default ignore pattern: hidden files, _directories, backups; and the 2x sheets,
            // which Android never loads (TextureScale.cpp: 1x there), left out of the APK below.
            def parts = name.split('/')
            if (parts.any { it.startsWith('.') } || parts[0..-2].any { it.startsWith('_') } || name.endsWith('~') ||
                parts[0..-2].any { it in SKIPPED_DIRS }) {
                return
            }
            names << name
        }
        names.sort()
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        names.each { name ->
            def file = new File(root, name)
            digest.update("${name}\t${file.length()}\t${file.lastModified()}\n".getBytes("UTF-8"))
        }
        def stamp = digest.digest().encodeHex().toString()
        def out = outputDir.get().asFile
        out.mkdirs()
        new File(out, "assets.txt").setText("# ${stamp}\n" + names.join("\n") + "\n", "UTF-8")
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "org.openeggbert.speedyblupi"
    compileSdkVersion 35
    // NDK r29, the stable release CNA's Android SDL cache (cna/.sdl-prebuilt-Android-*) is built
    // with; r30 is still a beta (OR-0011, 2026-11-03).
    ndkVersion = "29.0.14206865"

    defaultConfig {
        // Its own id: mobile-eggbert's Android app is org.openeggbert.speedyblupi, and the two must
        // install side by side (2026-11-09).
        applicationId "org.openeggbert.galaxyeggbert"
        // API 24: CNA's minimum (cna/docs/devices-build.md).
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 7 // 0.4.0 (0.1.0 was 1, 0.1.1 2, 0.1.2 3, 0.1.3 4, 0.2.0 5, 0.3.0 6): every published APK a higher one
        // The release's version (VERSION.txt at the repository's root), as the desktop archive's.
        versionName rootProject.file("../VERSION.txt").text.trim()
        ndk {
            abiFilters(*((project.findProperty("galaxyAbis") ?: "arm64-v8a,x86_64").toString().split(",")))
        }

        externalNativeBuild {
            cmake {
                // Pass Android platform and C++ STL config.
                arguments "-DANDROID_PLATFORM=android-24",
                          "-DANDROID_STL=c++_static",
                          // Disable sharp-runtime and CNA tests (they use gtest
                          // which is not needed in the APK build).
                          "-DCNA_BUILD_TESTS=OFF",
                          "-DSHARP_RUNTIME_BUILD_TESTS=OFF",
                          *nativeBuildExtraArguments
                // -PgalaxyAbis=arm64-v8a builds one (a release for phones); unlike Android Studio's
                // injected ABI it does not mark the APK test-only (2026-11-10).
                abiFilters(*((project.findProperty("galaxyAbis") ?: "arm64-v8a,x86_64").toString().split(",")))
                // Only the game (libmain.so) and what it links; not the desktop verifiers.
                targets "GalaxyEggbertCNA"
            }
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            } else {
                // key.properties not found – assembleRelease will fail with a clear message below
            }
        }
    }
    buildTypes {
        release {
            if (!keystorePropertiesFile.exists()) {
                doFirst {
                    throw new GradleException(
                        "\n\n" +
                        "========================================================\n" +
                        " ERROR: key.properties not found in android/ directory.\n" +
                        " Cannot build a signed release APK.\n" +
                        " See ANDROID.md for instructions on creating key.properties.\n" +
                        "========================================================\n"
                    )
                }
            }
            signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            // Point to the game's root CMakeLists.txt (one level up from android/).
            path '../../CMakeLists.txt'
            version "4.1.2"
        }
    }

    // Package game assets into the APK as Android assets (read-only).
    //
    // Asset layout in the APK must match the paths the game uses at runtime.
    // The game loads e.g. "Content/backgrounds/decor000.png" and "worlds/world001.txt".
    // SDL_IOFromFile on Android first checks internal storage, then the APK AAssetManager.
    //
    // We set the asset source to the galaxy-eggbert root so that the directory
    // structure is preserved:
    //   <galaxy-eggbert>/Content/backgrounds/... -> Content/backgrounds/... in APK
    //   <galaxy-eggbert>/worlds/...              -> worlds/... in APK
    //
    // Other files at that level (src/, cmake/, etc.) are excluded by AGP because
    // the asset merger only includes directories/files reachable from assets.srcDirs.
    // aapt's default ignore pattern plus the 2x sheets' directories (GalaxyAssetManifest.SKIPPED_DIRS).
    androidResources {
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:" +
                              GalaxyAssetManifest.SKIPPED_DIRS.collect { "!<dir>${it}" }.join(':')
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            java.srcDirs = [
                // SDL3 Java glue (SDLActivity, SDLAudioManager, etc.) from CNA's SDL
                new File(cnaHome, 'third_party/SDL/android-project/app/src/main/java'),
                // Game-specific Java (just the minimal stub subclassing SDLActivity)
                'src/main/java'
            ]
            res.srcDirs = ['src/main/res']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    // No extra Java/Kotlin dependencies required – SDL provides the full activity.
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def manifestTask = project.tasks.register("${variant.name}GalaxyAssetManifest", GalaxyAssetManifest) {
            assetRoot.set(project.layout.projectDirectory.dir("src/main/assets"))
            assetTree.from(project.fileTree("src/main/assets") {
                GalaxyAssetManifest.SKIPPED_DIRS.each { dir -> exclude "**/${dir}/**" }
            })
            outputDir.set(project.layout.buildDirectory.dir("generated/galaxyAssetManifest/${variant.name}"))
        }
        variant.sources.assets.addGeneratedSourceDirectory(manifestTask, { it.outputDir })
    }
}
