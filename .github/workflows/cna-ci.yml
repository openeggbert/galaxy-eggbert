# BUILD-009 (plan.md, NEXT.md "Sibling-repo commit pins"): CI for GalaxyEggbertCNA, the sole
# game target. Linux only (Web CI is BUILD-003,
# not done yet); no golden-frame/golden-trace steps (those need a real/virtual GPU display and
# stay a manual, explicit local step -- see NEXT.md section 7).
#
# Sibling repos (cna, cna-engine, easy-gl, sharp-runtime, meta-gl) are plain sibling checkouts
# referenced via add_subdirectory(../x) in CMakeLists.txt, not git submodules of this repo -- same
# pattern ../cna's own devices-tests.yml/input-ci.yml already use for the same reason. Pinned to
# the exact commits NEXT.md's "Sibling-repo commit pins" table records as last verified to
# build/pass against (meta-gl is a transitive dependency of ../easy-gl, not in that table -- see
# the Checkout meta-gl step below) -- update both places together when bumping a sibling.
# mobile-eggbert is a separate, sparse (worlds/ only) checkout -- test DATA, not a build
# dependency (never add_subdirectory()'d); see the Checkout mobile-eggbert step below.

name: GalaxyEggbertCNA CI

on:
  # web/ is the static website, deployed by pages.yml; editing it must not
  # rebuild and retest the game.
  push:
    branches: [ develop, master ]
    paths-ignore: [ 'web/**' ]
  pull_request:
    branches: [ develop, master ]
    paths-ignore: [ 'web/**' ]
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build + ctest (build-cna, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout galaxy-eggbert
        uses: actions/checkout@v4
        with:
          path: galaxy-eggbert

      - name: Checkout cna
        uses: actions/checkout@v4
        with:
          repository: libcna/cna
          # cna-engine's compatibility baseline (its docs/adr/ADR-002); move both together.
          ref: 900d0db3b52d76d3115ebda0a0e04a25fefad1a5
          path: cna
          submodules: true # non-recursive on purpose -- avoids SDL_mixer's own nested
                            # optional-codec submodules this project's CMake args disable

      - name: Checkout cna-engine
        uses: actions/checkout@v4
        with:
          repository: libcna/cna-engine
          ref: d86c62da9c6078435a1596e7a44d9b286d3b35ac
          path: cna-engine

      - name: Checkout easy-gl
        uses: actions/checkout@v4
        with:
          repository: libcna/easy-gl
          ref: f4d6afaf16cdc7e7e73130950bc45e6d865b41bd # v0.1.1, the version this CNA requires
          path: easy-gl

      - name: Checkout sharp-runtime
        uses: actions/checkout@v4
        with:
          repository: libcna/sharp-runtime
          ref: f2aecfefeac171b331787e5cdc4849507363ef0e
          path: sharp-runtime

      # Not in NEXT.md's "Sibling-repo commit pins" table (a real gap fixed alongside this
      # workflow) -- ../easy-gl/CMakeLists.txt unconditionally add_subdirectory(../meta-gl), so
      # this is a genuine transitive build dependency, not optional.
      - name: Checkout meta-gl
        uses: actions/checkout@v4
        with:
          repository: libcna/meta-gl
          ref: dd3b30055d55fdc42240de7af248259338256992 # v0.4.1, the version this CNA requires
          path: meta-gl

      # VerifyMoveObjectTypesCna/VerifyBigDecorParsingCna (CMakeLists.txt WORKING_DIRECTORY =
      # repo root) read real "../mobile-eggbert/worlds/*.txt" files directly off disk, not
      # embedded fixtures -- a genuine test-data dependency, not a build dependency (mobile-eggbert
      # is never add_subdirectory()'d). Sparse-checkout just worlds/ (a few MB): the full repo is
      # ~2.3 GB, almost all of it Content/ (sprite sheets/sounds) neither test needs.
      - name: Checkout mobile-eggbert (worlds/ only)
        uses: actions/checkout@v4
        with:
          repository: openeggbert/mobile-eggbert
          ref: 07e0a67365535154e614d1baed192e489cb28393
          path: mobile-eggbert
          sparse-checkout: worlds
          sparse-checkout-cone-mode: true

      # Same package list as ../cna's own devices-tests.yml (proven to build this dependency
      # tree on ubuntu-latest already) plus ccache, which that workflow doesn't use, and libcurl
      # and nlohmann-json, which CNA's networking and GamerServices modules require since the
      # move to cna-engine's CNA baseline (both are on by default in CNA).
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config ccache \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev \
            libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libthai-dev libwayland-dev libdecor-0-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libcurl4-openssl-dev nlohmann-json3-dev

      # Vendored SDL3/SDL3_mixer are built from source on first configure (several
      # minutes) into cna/.sdl-prebuilt-Linux-x86_64/ -- keyed off the exact submodule commits so
      # a submodule bump invalidates it automatically, same pattern as ../cna's own CI.
      - name: Cache vendored SDL prebuilt tree
        uses: actions/cache@v4
        with:
          path: cna/.sdl-prebuilt-Linux-x86_64*
          key: sdl-prebuilt-linux-x86_64-${{ hashFiles('cna/third_party/SDL/**', 'cna/third_party/SDL_mixer/**') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-galaxy-eggbert-cna-${{ github.sha }}
          restore-keys: |
            ccache-galaxy-eggbert-cna-

      - name: Configure
        run: |
          cmake -S galaxy-eggbert -B galaxy-eggbert/build-cna \
            -DGALAXY_EGGBERT_BUILD_CNA=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build galaxy-eggbert/build-cna -j2

      # easy-gl-resource-smoke-tests is a known, pre-existing upstream ../easy-gl failure,
      # unrelated to galaxy-eggbert (see NEXT.md "Sibling-repo commit pins" -- "Known upstream
      # failures, quarantined"). Excluded here so CI stays green for genuine galaxy-eggbert
      # regressions; if this ever starts failing for a DIFFERENT reason, that's a real signal.
      - name: Run ctest
        run: |
          ctest --test-dir galaxy-eggbert/build-cna --output-on-failure \
            -E 'easy-gl-resource-smoke-tests'
